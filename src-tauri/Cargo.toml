[package]
name = "personal-agent"
version = "1.0.0"
description = "Personal Agent - Autonomous Desktop AI Assistant"
authors = ["Aditya Singh"]
edition = "2021"

[lib]
name = "personal_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.12", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-shell = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
